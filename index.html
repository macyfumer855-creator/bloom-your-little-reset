<!DOCTYPE html>
<html lang="en">
    <head>
        <!--01.Document setup-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#fff7f8">
        <meta name="description" content="Bloom is your gentle space for habits, hydration, journaling, and little resets.">
        <title>Bloom - Your Little Reset</title>

        <!--02. Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis/com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">

        <!--03. Styles-->
        <style>
            /* 04. Theme variables */
            :root {
                color-scheme: light;
                --bg: #fff8f8;
                --surface: #ffffff;
                --surface-soft: #fff1f4;
                --pink: #e99cae;
                --pink-dark: #c76f88;
                --pink-light: #fde8ed;
                --text: #44373d;
                --muted: #917f87;
                --border: #f2dfe5;
                --green: #9ebda5;
                --green-soft: #e8f2e9;
                --yellow: #f3dca0;
                --blue-soft: #e3f3f8;
                --shadow: 0 8px 38px rgba(160, 105, 125, 0.08);
                --radius-lg: 24px;
                --radius-md: 16px;
                --radius-sm: 12px;
                --content-width: 1120px;
            }

            /*05. Dark theme*/
            body.dark {
                color-scheme: dark;
                --bg: #211c24;
                --surface: #302832;
                --surface-soft: #3a2b36;
                --pink: #e7a0b5;
                --pink-dark: #e7a0b5;
                --pink-light: #48313d;
                --text: #f8edf1;
                --muted: #c1aeb9;
                --border: #4c3c49;
                --green: #a5c7ac;
                --green-soft: #2e4035;
                --yellow: #e8d49a;
                --blue-soft: #2b4148;
                --shadow: 0 8px 30px rgba(0, 0, 0, 0.16);
            }

            /* 06. Global rest */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                scroll-behavior: smooth;
                scroll-padding-top: 20px;
            }

            body {
                margin: 0;
                min-height: 100vh;
                background: var(--bg);
                color: var(--text);
                font-family: 'DM Sans', sans-serif;
                transition: background 0.25s ease, color 0.25s ease;
            }

            button,
            input,
            textarea,
            select {
                font: inherit;
            }

            button {
                cursor: pointer;
            }

            button:focus-visible,
            input:focus-visible,
            textarea:focus-visible,
            select:focus-visible,
            a:focus-visible {
                outline: 3px solid var(--pink);
                outline-offset: 3px;
            }

            button:disabled {
                cursor: not-allowed;
                opacity: 0.55;
            }

            a {
                color: var(--pink-dark);
            }

            img,
            svg {
                max-width: 100%;
            }

            /* 07. Main layout */
            .container {
                width: min(var(--content-width),92%);
                margin-inline: auto;
            }

            .skip-link {
                position: absolute;
                top: -100px;
                left: 12px;
                z-index: 100;
                padding: 10px 14px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
            }

            .skip-link:focus {
                top: 12px;
            }

            /* 08. Header */
            header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 16px;
                padding: 22px 0;
                border-bottom: 1px solid var(--border);
            }

            .brand { 
                font-family: 'Playfair Display', serif;
                font-size: 32px;
                font-weight: 700;
                line-height: 1.05;
                color: var(--pink-dark);
                letter-spacing: -0.8px;
            }

            .brand small {
                display: block;
                margin-top: 5px;
                font: 700 10px 'DM Sans', sans-serif;
                color: var(--muted);
                letter-spacing: 1.7px;
            }

            .header-actions { 
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 9px;
            }

            .icon-button,
            .secondary-button {
                min-height: 42px;
                border: 1px solid var(--border);
                background: var(--surface);
                color: var(--text);
                border-radius: 14px;
                padding: 10px 14px;
                transition: transform 0.15s ease, border-color 0.15s ease;
            }

            .icon-button:hover,
            .secondary-button:hover {
                border-color: var(--pink);
                transform: translateY(-1px);
            }

            /* 09. Navigation */
            .main-nav {
                display: flex;
                gap: 8px;
                overflow-x: auto;
                padding: 13px 0 3px;
                scrollbar-width: thin;
            }

            .nav-link {
                flex: 0 0 auto;
                padding: 9px 13px;
                border: 1px solid transparent;
                border-radius: 999px;
                color: var(--muted);
                text-decoration: none;
                font-size: 13px;
                font-weight: 700;
            }

            .nav-link:hover,
            .nav-link.active {
                color: var(--pink-dark);
                background: var(--pink-light);
                border-color: var(--border);
            }

            /* 10. Hero */
            .hero {
                display: grid;
                grid-template-columns: 1.5fr 1fr;
                align-items: center;
                gap: 28px;
                padding: 38px 0 25px;
            }

            .eyebrow {
                color: var(--pink-dark);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            h1,
            h2,
            h3,
            p {
                margin-top: 0;
            }

            h1 { 
                margin: 12px 0;
                font: 500 clamp(35px, 5vw, 55px)/1.12'Playfair Display',serif; 
                letter-spacing: -1px;
            }

            h1 span {
                color: var(--pink-dark);
                font-style: italic;
            }

            .hero-copy {
                max-width: 620px;
                color: var(--muted);
                line-height: 1.8;
            }

            .primary-button {
                min-height: 43px;
                border:0;
                border-radius: 14px;
                background: var(--pink-dark);
                color: #fff;
                padding: 12px 18px;
                font-weight: 700;
                box-shadow: 0 5px 16px rgba(199, 111, 136, 0.15);
                transition: opacity 0.15s ease, transform 0.15s ease;
            }

            .primary-button:hover {
                opacity: 0.9;
                transform: translateY(-1px);
            }

            .hero-card {
                padding: 25px;
                border: 1px solid var(--border);
                border-radius: 27px;
                background: var(--pink-light);
                text-align: center;
            }
